name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches .devcontainer/devcontainer.json's pinned image
          # (mcr.microsoft.com/devcontainers/python:1-3.11-bookworm), so CI
          # runs the same interpreter version the Codespaces environment uses.
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Deliberately configured with NO repository secrets. tests/ is
        # built specifically to need no API keys and no network access
        # (see tests/test_reconstruct_vrp.py's module docstring) -- this
        # job passing is itself the proof of that claim, not just a
        # description of it.
        run: pytest tests/ -q
