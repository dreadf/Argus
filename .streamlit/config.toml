# Design tokens for the public dashboard: a warm-neutral "instrument panel"
# palette with a teal accent (previously amber -- dropped after direct
# feedback: "I don't like the yellowish look"). Kept in config.toml (not
# just inline CSS) so Streamlit's own native widgets (st.dataframe,
# st.metric borders, buttons) pick these up automatically -- custom CSS
# in app.py cannot reach inside those canvas-rendered components.

[theme]
base = "dark"
primaryColor = "#4FBDBA"
backgroundColor = "#14120F"
secondaryBackgroundColor = "#1D1A16"
textColor = "#EAE3D6"
font = "sans serif"

[server]
headless = true
